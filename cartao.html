<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#123C3E" />
<title>Meu QR Code — Festival do Rio 2026</title>
<link rel="icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #123C3E; color: #fff;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 18px calc(28px + env(safe-area-inset-bottom, 0px));
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  #cartao {
    width: 100%; height: auto; display: block;
    border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    background: #fff;
  }
  .acoes { margin-top: 18px; display: grid; gap: 10px; }
  button {
    font: inherit; font-weight: 600; font-size: 16px;
    border: 0; border-radius: 14px; padding: 14px 16px; cursor: pointer;
  }
  .principal { background: #E8B923; color: #0B2728; }
  .principal:focus-visible { outline: 3px solid #F3D064; outline-offset: 2px; }
  .dica { font-size: 13px; color: rgba(255,255,255,.7); line-height: 1.5; margin: 14px 4px 0; }
  .aviso { background: #fff; color: #123C3E; border-radius: 18px; padding: 32px 22px; }
  .aviso h1 { font-size: 22px; margin: 0 0 8px; }
  .aviso.cancelado h1 { color: #DC2626; }
  .aviso p { margin: 0; color: #5b6b6c; line-height: 1.5; }
  .carregando { color: rgba(255,255,255,.75); margin-top: 40vh; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <p id="carregando" class="carregando">Carregando seu cartão…</p>

  <div id="areaCartao" class="hidden">
    <img id="cartao" alt="Cartão com QR Code de alimentação" />
    <div class="acoes">
      <button id="btnSalvar" class="principal">Salvar no celular</button>
    </div>
    <p class="dica">Se o botão não funcionar, toque e segure a imagem para salvá-la. Apresente este QR Code no controle de almoço.</p>
  </div>

  <div id="areaAviso" class="aviso hidden">
    <h1 id="avisoTitulo"></h1>
    <p id="avisoTexto"></p>
  </div>
</main>

<script>
// Esta página só consegue buscar UM cartão, pelo código do link (função cartao_por_token no Supabase).
const SUPABASE_URL = "https://lzinjaepltmkyrzbpaht.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6aW5qYWVwbHRta3lyemJwYWh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNzk5MzMsImV4cCI6MjEwNDY1NTkzM30.-6xlbrsoQfokPLi6HtKf-fDUSvmtTwf3bYJG_MuHqJM";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });

let logoImgPromise = null;
function carregarLogoImg() {
  if (!logoImgPromise) {
    logoImgPromise = new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = 'logo.png';
    });
  }
  return logoImgPromise;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function textoCentralizadoComQuebra(ctx, texto, x, y, larguraMax, alturaLinha) {
  const palavras = texto.split(' ');
  const linhas = [];
  let linhaAtual = '';
  palavras.forEach(p => {
    const teste = linhaAtual ? linhaAtual + ' ' + p : p;
    if (ctx.measureText(teste).width > larguraMax && linhaAtual) { linhas.push(linhaAtual); linhaAtual = p; }
    else linhaAtual = teste;
  });
  linhas.push(linhaAtual);
  const inicioY = y - ((linhas.length - 1) * alturaLinha) / 2;
  linhas.forEach((linha, i) => ctx.fillText(linha, x, inicioY + i * alturaLinha));
  return linhas.length;
}

// Gera um cartão vertical (proporção de tela de celular) com o QR Code, pronto para imprimir/baixar
async function gerarCartaoQR(nome, setor, conteudoQr) {
  const W = 1080, H = 1920;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // fundo branco
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, W, H);

  // logo oficial do festival
  const logoImg = await carregarLogoImg();
  const logoMaxW = 480;
  let logoW = logoMaxW, logoH = 260;
  if (logoImg) {
    logoW = logoMaxW;
    logoH = logoMaxW * (logoImg.naturalHeight / logoImg.naturalWidth);
  }
  const logoX = (W - logoW) / 2, logoY = 90;
  if (logoImg) ctx.drawImage(logoImg, logoX, logoY, logoW, logoH);

  // título
  ctx.fillStyle = '#123C3E';
  ctx.font = 'bold 56px Inter, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('FESTIVAL DO RIO 2026', W / 2, logoY + logoH + 90);
  ctx.fillStyle = '#9a958a';
  ctx.font = '34px Inter, sans-serif';
  ctx.fillText('Controle de Alimentação', W / 2, logoY + logoH + 140);

  // linha divisória
  ctx.strokeStyle = '#eee8dc'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(90, 560); ctx.lineTo(W - 90, 560); ctx.stroke();

  // Nome e setor
  ctx.fillStyle = '#123C3E';
  ctx.font = 'bold 58px Inter, sans-serif';
  const linhasNome = textoCentralizadoComQuebra(ctx, nome, W / 2, 660, W - 160, 68);
  ctx.fillStyle = '#8a8578';
  ctx.font = '36px Inter, sans-serif';
  ctx.fillText(setor, W / 2, 660 + linhasNome * 68 + 10);

  // QR Code
  const qrSize = 620;
  const qrX = (W - qrSize) / 2, qrY = 900;
  const temp = document.createElement('div');
  temp.style.position = 'fixed'; temp.style.left = '-9999px';
  document.body.appendChild(temp);
  await new Promise(resolve => { new QRCode(temp, { text: conteudoQr, width: qrSize, height: qrSize, correctLevel: QRCode.CorrectLevel.M }); setTimeout(resolve, 150); });
  const qrCanvasEl = temp.querySelector('canvas');
  const qrImgEl = temp.querySelector('img');

  ctx.fillStyle = '#FFFFFF';
  ctx.strokeStyle = '#E8B923'; ctx.lineWidth = 4;
  roundRect(ctx, qrX - 30, qrY - 30, qrSize + 60, qrSize + 60, 28);
  ctx.fill(); ctx.stroke();
  if (qrCanvasEl) ctx.drawImage(qrCanvasEl, qrX, qrY, qrSize, qrSize);
  else if (qrImgEl) ctx.drawImage(qrImgEl, qrX, qrY, qrSize, qrSize);
  temp.remove();

  // rodapé
  ctx.fillStyle = '#9a958a';
  ctx.font = '30px Inter, sans-serif';
  ctx.fillText('Apresente este QR Code no controle de almoço', W / 2, qrY + qrSize + 90);

  return canvas;
}

function sanitizeFileName(str) {
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}

function mostrarAviso(titulo, texto, cancelado = false) {
  document.getElementById('carregando').classList.add('hidden');
  const box = document.getElementById('areaAviso');
  box.classList.toggle('cancelado', cancelado);
  document.getElementById('avisoTitulo').textContent = titulo;
  document.getElementById('avisoTexto').textContent = texto;
  box.classList.remove('hidden');
}

async function iniciar() {
  const token = new URLSearchParams(location.search).get('c') || '';
  if (!/^[a-f0-9]{32}$/i.test(token)) {
    mostrarAviso('Link inválido', 'Confira se o link foi copiado completo ou peça um novo à produção.');
    return;
  }

  const { data, error } = await sb.rpc('cartao_por_token', { p_token: token });
  if (error) {
    mostrarAviso('Não foi possível carregar', 'Verifique sua conexão com a internet e abra o link de novo.');
    return;
  }
  const f = Array.isArray(data) ? data[0] : data;
  if (!f) {
    mostrarAviso('Cartão não encontrado', 'Este link não corresponde a nenhum cartão. Peça um novo à produção.');
    return;
  }
  if (f.status === 'cancelado') {
    mostrarAviso('Cartão cancelado', 'Este QR Code não é mais válido. Fale com a produção do festival.', true);
    return;
  }

  if (document.fonts && document.fonts.load) {
    try { await Promise.all([document.fonts.load('bold 58px Inter'), document.fonts.load('36px Inter')]); } catch (e) {}
  }
  const canvas = await gerarCartaoQR(f.nome_completo, f.setor, f.id);
  const dataUrl = canvas.toDataURL('image/png');
  const nomeArquivo = `QRCode_${sanitizeFileName(f.nome_completo)}.png`;
  document.getElementById('cartao').src = dataUrl;
  document.getElementById('carregando').classList.add('hidden');
  document.getElementById('areaCartao').classList.remove('hidden');

  document.getElementById('btnSalvar').addEventListener('click', async () => {
    try {
      const blob = await (await fetch(dataUrl)).blob();
      const arquivo = new File([blob], nomeArquivo, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
        await navigator.share({ files: [arquivo], title: 'Meu QR Code — Festival do Rio 2026' });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return; // pessoa fechou a janela de compartilhar
    }
    const a = document.createElement('a');
    a.href = dataUrl; a.download = nomeArquivo;
    document.body.appendChild(a); a.click(); a.remove();
  });
}

iniciar();
</script>
</body>
</html>
